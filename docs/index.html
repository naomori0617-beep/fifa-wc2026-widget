<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FIFA World Cup 2026 — 日程・結果</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font-family: -apple-system, "Hiragino Sans", "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(160deg, #0b3d2e, #061712);
        color: #fff;
        padding: 16px;
      }
      h1 { font-size: 18px; margin: 0 0 2px; }
      .meta { color: #9fd9bf; font-size: 12px; margin-bottom: 16px; }
      .day { color: #9fd9bf; font-size: 13px; font-weight: 700; margin: 18px 0 6px; }
      .match {
        display: grid;
        grid-template-columns: 64px 1fr auto;
        gap: 8px;
        align-items: center;
        padding: 8px 10px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        margin-bottom: 6px;
      }
      .status { font-size: 11px; color: #9fd9bf; }
      .status.live { color: #ff4d4d; font-weight: 700; }
      .teams { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .team { display: flex; align-items: center; gap: 6px; }
      .team img { width: 18px; height: 12px; border-radius: 2px; }
      .team .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .score { font-weight: 800; font-size: 16px; text-align: right; min-width: 28px; }
      .win { color: #ffd54a; }
      .group { color: #9fd9bf; font-size: 10px; }
      a.raw { color: #9fd9bf; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>⚽ FIFA World Cup 2026 — 日程・結果</h1>
    <div class="meta" id="meta">読み込み中…</div>
    <div id="list"></div>
    <p><a class="raw" href="./data.json">data.json を見る</a></p>

    <script>
      const dtf = new Intl.DateTimeFormat("ja-JP", {
        month: "numeric", day: "numeric", weekday: "short",
        hour: "2-digit", minute: "2-digit",
      });
      const dayKey = new Intl.DateTimeFormat("ja-JP", {
        month: "long", day: "numeric", weekday: "short",
      });

      function teamHTML(t, win) {
        const flag = t.flag ? `<img src="${t.flag}" alt="">` : "";
        return `<div class="team">${flag}<span class="nm">${t.name}</span></div>`;
      }

      async function main() {
        const res = await fetch("./data.json?_=" + Date.now());
        const data = await res.json();
        document.getElementById("meta").textContent =
          `${data.competition} ・ 全${data.count}試合 ・ 更新 ${dtf.format(new Date(data.updated))}`;

        const list = document.getElementById("list");
        let curDay = "";
        for (const m of data.matches) {
          const d = new Date(m.date);
          const dk = dayKey.format(d);
          if (dk !== curDay) {
            curDay = dk;
            const h = document.createElement("div");
            h.className = "day";
            h.textContent = dk;
            list.appendChild(h);
          }
          const statusTxt =
            m.status === "live" ? "● LIVE"
            : m.status === "finished" ? "終了"
            : dtf.format(d);
          const hWin = m.home.score != null && m.away.score != null && m.home.score > m.away.score;
          const aWin = m.home.score != null && m.away.score != null && m.away.score > m.home.score;
          const sc = (s, win) => s == null ? "" : `<div class="score ${win ? "win" : ""}">${s}</div>`;
          const el = document.createElement("div");
          el.className = "match";
          el.innerHTML = `
            <div>
              <div class="status ${m.status === "live" ? "live" : ""}">${statusTxt}</div>
              <div class="group">${m.group || m.stage || ""}</div>
            </div>
            <div class="teams">
              ${teamHTML(m.home)}
              ${teamHTML(m.away)}
            </div>
            <div>
              ${sc(m.home.score, hWin)}
              ${sc(m.away.score, aWin)}
            </div>`;
          list.appendChild(el);
        }
      }
      main().catch((e) => {
        document.getElementById("meta").textContent = "読み込みに失敗しました: " + e.message;
      });
    </script>
  </body>
</html>
