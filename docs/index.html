<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FIFA WC2026 — 次の2試合ウィジェット プレビュー</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #e9eaee;
        font-family: -apple-system, "Hiragino Sans", "Segoe UI", system-ui, sans-serif;
        padding: 24px;
      }
      .label { color: #6b6b76; font-size: 12px; }

      /* iOS 中サイズウィジェット相当のカード */
      .widget {
        width: 338px;
        background: #ffffff;
        border-radius: 22px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        padding: 14px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
      }
      .match { display: flex; flex-direction: column; gap: 6px; }
      .date { text-align: center; font-size: 11px; font-weight: 400; color: #7a7a86; }
      .date.live { color: #e4002b; }

      .row { display: flex; align-items: center; }
      .side { display: flex; align-items: center; gap: 7px; width: 120px; }
      .side.home { justify-content: flex-end; }
      .side.away { justify-content: flex-start; }
      .name {
        font-size: 15px; font-weight: 400; color: #1a1a22;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .flag {
        width: 32px; height: 21px; border-radius: 0; /* 角ばった四角形 */
        border: 1px solid rgba(0, 0, 0, 0.12); object-fit: cover; display: block; flex: none;
      }
      .kickoff {
        width: 64px; text-align: center; font-size: 20px; font-weight: 500; color: #1a1a22;
      }
      .kickoff.live { color: #e4002b; }
      .meta { text-align: center; font-size: 10px; font-weight: 400; color: #7a7a86; }
      .divider { height: 1px; background: #ececf0; }
      .empty { text-align: center; color: #7a7a86; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="label">中サイズウィジェット プレビュー（実機の Scriptable と同じ見た目）</div>
    <div class="widget" id="widget"><div class="empty">読み込み中…</div></div>
    <div class="label"><a href="./data.json">data.json</a></div>

    <script>
      const SHOW = 2;
      const dDate = new Intl.DateTimeFormat("ja-JP", { month: "numeric", day: "numeric", weekday: "short" });
      const dTime = new Intl.DateTimeFormat("ja-JP", { hour: "2-digit", minute: "2-digit", hour12: false });

      function flagImg(t) {
        return t.flag ? `<img class="flag" src="${t.flag}" alt="">` : "";
      }
      function metaText(m) {
        const venue = m.stadium ? (m.city ? `${m.stadium}（${m.city}）` : m.stadium) : null;
        return [m.stage, m.group, venue].filter(Boolean).join("　・　");
      }
      function matchHTML(m) {
        const d = new Date(m.date);
        const live = m.status === "live";
        const ko = live ? "LIVE" : dTime.format(d);
        const meta = metaText(m);
        return `
          <div class="match">
            <div class="date ${live ? "live" : ""}">${dDate.format(d)}</div>
            <div class="row">
              <div class="side home"><span class="name">${m.home.name}</span>${flagImg(m.home)}</div>
              <div class="kickoff ${live ? "live" : ""}">${ko}</div>
              <div class="side away">${flagImg(m.away)}<span class="name">${m.away.name}</span></div>
            </div>
            ${meta ? `<div class="meta">${meta}</div>` : ""}
          </div>`;
      }

      async function main() {
        const res = await fetch("./data.json?_=" + Date.now());
        const data = await res.json();
        const next = (data.matches || [])
          .filter((m) => m.status === "live" || m.status === "upcoming")
          .slice(0, SHOW);
        const el = document.getElementById("widget");
        if (!next.length) {
          el.innerHTML = '<div class="empty">予定された試合はありません</div>';
          return;
        }
        el.innerHTML = next.map(matchHTML).join('<div class="divider"></div>');
      }
      main().catch((e) => {
        document.getElementById("widget").innerHTML =
          '<div class="empty">読み込みに失敗: ' + e.message + "</div>";
      });
    </script>
  </body>
</html>
