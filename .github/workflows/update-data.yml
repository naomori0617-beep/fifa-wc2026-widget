name: Update FIFA data

on:
  # 10 分ごとに自動実行（GitHub の都合で多少遅延することがあります）
  schedule:
    - cron: "*/10 * * * *"
  # 手動実行も可能（Actions タブの "Run workflow"）
  workflow_dispatch:

# data.json をコミットするための書き込み権限
permissions:
  contents: write

# 同時実行を抑止（前の実行が終わるまで重ねない）
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch FIFA data
        run: node scripts/fetch.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: update $(date -u +%FT%TZ)"
            git push
          fi
