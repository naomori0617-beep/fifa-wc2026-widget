name: Update FIFA data

on:
  # 5 分ごと（GitHub の cron 最短間隔）。各実行内でさらにループして約1分間隔で取得する
  schedule:
    - cron: "*/5 * * * *"
  # 手動実行も可能（Actions タブの "Run workflow"）
  workflow_dispatch:

# data.json をコミットするための書き込み権限
permissions:
  contents: write

# 実行が重ならないように直列化
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch & commit every ~60s for ~4 min
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            node scripts/fetch.mjs || echo "fetch failed (attempt $i), keeping previous data"
            git add docs/data.json
            if git diff --staged --quiet; then
              echo "[$i] no change"
            else
              git commit -m "data: update $(date -u +%FT%TZ)"
              git pull --rebase --autostash -q origin main || true
              git push origin main || echo "push failed (attempt $i)"
            fi
            if [ "$i" -lt 4 ]; then sleep 60; fi
          done
